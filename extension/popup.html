<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 280px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    color: #1a1a2e;
    background: #fafafa;
    padding: 16px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .header h1 {
    font-size: 15px;
    font-weight: 600;
  }
  .logo {
    width: 24px;
    height: 24px;
    background: #6366f1;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 14px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: white;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    margin-bottom: 12px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.on { background: #22c55e; }
  .dot.off { background: #ef4444; }
  .status-text {
    flex: 1;
    font-size: 12px;
    color: #6b7280;
  }
  .status-text strong {
    display: block;
    color: #1a1a2e;
    font-size: 13px;
  }
  .port-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .port-row label {
    font-size: 12px;
    color: #6b7280;
    white-space: nowrap;
  }
  .port-row input {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    width: 60px;
  }
  .port-row input:focus { border-color: #6366f1; }
  button {
    width: 100%;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 6px;
  }
  .btn-connect {
    background: #6366f1;
    color: white;
  }
  .btn-connect:hover { background: #4f46e5; }
  .btn-disconnect {
    background: #f3f4f6;
    color: #6b7280;
  }
  .btn-disconnect:hover { background: #e5e7eb; }
  .version {
    text-align: center;
    font-size: 11px;
    color: #9ca3af;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">G</div>
    <h1>Ghost Bridge</h1>
  </div>

  <div class="status" id="status">
    <div class="dot off" id="dot"></div>
    <div class="status-text">
      <strong id="statusLabel">Disconnected</strong>
      <span id="statusDetail">Not connected to daemon</span>
    </div>
  </div>

  <div class="port-row">
    <label>Port:</label>
    <input type="number" id="port" value="9377" min="1024" max="65535">
  </div>

  <button class="btn-connect" id="connectBtn">Connect</button>
  <button class="btn-disconnect" id="disconnectBtn">Disconnect</button>

  <div class="version" id="version"></div>

  <script src="popup.js"></script>
</body>
</html>
